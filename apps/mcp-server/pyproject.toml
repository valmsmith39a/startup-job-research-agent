[project]
name = "job-research-mcp"
version = "0.1.0"
description = "MCP server exposing startup job-research tools over Streamable HTTP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.scripts]
job-research-mcp = "job_research_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real external APIs; skipped unless RUN_LIVE_TESTS=1"]
