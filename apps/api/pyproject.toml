[project]
name = "job-research-api"
version = "0.1.0"
description = "FastAPI service that will run the job-research agent behind POST /chat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.30",
]

[project.scripts]
job-research-api = "job_research_api.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
